[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-toolkit"
version = "0.1.0"
description = "Reusable RAG building blocks: Milvus storage, reranking, query expansion, context compression"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # 精简自 requirements.txt：移除 xinference-client（reranker.py 已改 requests 直调 model server）
    # pymilvus 锁 2.5.6：2.5.7+ 将 IndexParams 改为 list 子类，MilvusManager 的
    # IndexParams(field_name=...) 调用会报 "list() takes no keyword arguments"；
    # 2.6.x + milvus-lite 3.x 同样不兼容。2.5.6 是 smoke_full_chain.py 已验证版本。
    "pymilvus==2.5.6",
    "milvus-lite>=2.5.1,<3",
    # milvus-lite 2.5.1 依赖 pkg_resources，要求 setuptools<81（与 requirements.txt 注释一致）
    "setuptools<81",
    "openai>=1.0.0",
    "requests>=2.31.0",
    "numpy>=1.24.0",
    "loguru>=0.7.0",
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
    "pymysql>=1.1.0",
]

[tool.setuptools.packages.find]
include = ["rag_toolkit*"]
